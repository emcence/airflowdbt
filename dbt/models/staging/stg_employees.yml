version: 2

models:
  - name: stg_employees
    description: Cleaned, typed employees. One row per employee.
    columns:
      - name: employee_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: employee_name
        data_tests:
          - not_null
      - name: age
        data_tests:
          - value_between:
              arguments:
                min_value: 16
                max_value: 100
      - name: salary
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: city
        data_tests:
          - relationships:
              arguments:
                to: ref('city_region')
                field: city
